name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '17'
  MAVEN_OPTS: '-Xmx1024m -XX:MaxPermSize=256m'

jobs:
  validate-ssot:
    name: Validate SSoT
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install ajv-cli
        run: npm install -g ajv-cli

      - name: Validate SSoT schema
        run: |
          chmod +x scripts/validate-ssot.sh
          ./scripts/validate-ssot.sh

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: validate-ssot
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build backend
        run: |
          cd backend
          ./mvnw clean compile

      - name: Run tests
        run: |
          cd backend
          ./mvnw test

      - name: Generate test report
        uses: dorny/test-reporter@v1
        if: success() || failure()
        with:
          name: Maven Tests
          path: backend/target/surefire-reports/*.xml
          reporter: java-junit

      - name: Package application
        run: |
          chmod +x scripts/package-lambda.sh
          ./scripts/package-lambda.sh

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: cegm-backend-jar
          path: deployment/cegm-backend-1.0.0.jar
          retention-days: 30

  denylist-scan:
    name: Security Denylist Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Scan for secrets and localhost references
        run: |
          echo "🔍 Scanning for security issues..."
          
          # Check for common secrets patterns
          if grep -r "password.*=" --include="*.java" --include="*.properties" --include="*.yaml" --include="*.yml" backend/src/main/; then
            echo "❌ Found hardcoded passwords in source code"
            exit 1
          fi
          
          # Check for hardcoded localhost in non-dev files
          if grep -r "localhost" --include="*.java" backend/src/main/java/; then
            echo "❌ Found hardcoded localhost in Java source code"
            exit 1
          fi
          
          # Check for hardcoded ports in Java code
          if grep -rE ":[0-9]{4,5}" --include="*.java" backend/src/main/java/; then
            echo "❌ Found hardcoded ports in Java source code"
            exit 1
          fi
          
          # Check for AWS credentials
          if grep -rE "(aws_access_key|aws_secret)" --include="*.properties" --include="*.yaml" --include="*.yml" .; then
            echo "❌ Found AWS credentials in configuration files"
            exit 1
          fi
          
          echo "✅ Denylist scan passed"

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Set environment variables
        run: |
          echo "SERVER_PORT=8080" >> $GITHUB_ENV
          echo "API_BASE_PATH=/api" >> $GITHUB_ENV
          echo "DB_URL=jdbc:h2:mem:cegm;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE" >> $GITHUB_ENV
          echo "DB_USERNAME=sa" >> $GITHUB_ENV
          echo "DB_PASSWORD=" >> $GITHUB_ENV
          echo "DB_DRIVER=org.h2.Driver" >> $GITHUB_ENV
          echo "DB_DIALECT=org.hibernate.dialect.H2Dialect" >> $GITHUB_ENV
          echo "JWT_SECRET=${{ secrets.CI_JWT_SECRET }}" >> $GITHUB_ENV
          echo "JWT_EXPIRATION_HOURS=24" >> $GITHUB_ENV
          echo "COOKIE_NAME=cegm_session" >> $GITHUB_ENV
          echo "COOKIE_HTTP_ONLY=true" >> $GITHUB_ENV
          echo "COOKIE_SECURE=false" >> $GITHUB_ENV
          echo "COOKIE_SAME_SITE=Lax" >> $GITHUB_ENV
          echo "CORS_ALLOWED_ORIGINS=http://localhost:8080" >> $GITHUB_ENV
          echo "CORS_ALLOWED_METHODS=GET,POST,PUT,DELETE,OPTIONS" >> $GITHUB_ENV
          echo "CORS_ALLOW_CREDENTIALS=true" >> $GITHUB_ENV
          echo "APP_NAME=cegm" >> $GITHUB_ENV
          echo "APP_VERSION=1.0.0" >> $GITHUB_ENV
          echo "APP_ENVIRONMENT=ci" >> $GITHUB_ENV
          echo "APP_REGION=localhost" >> $GITHUB_ENV
          echo "BUILD_SHA=${{ github.sha }}" >> $GITHUB_ENV
          echo "RATE_LIMITING_ENABLED=true" >> $GITHUB_ENV
          echo "RATE_LIMITING_REQUESTS_PER_MINUTE=100" >> $GITHUB_ENV

      - name: Start application
        run: |
          cd backend
          ./mvnw spring-boot:run &
          
          # Wait for application to start
          echo "Waiting for application to start..."
          for i in {1..30}; do
            if curl -f http://localhost:8080/api/health >/dev/null 2>&1; then
              echo "Application started successfully"
              break
            fi
            echo "Attempt $i: Application not ready yet..."
            sleep 2
          done

      - name: Run smoke tests
        run: |
          chmod +x scripts/smoke-local.sh
          ./scripts/smoke-local.sh
