# ===================================================================
# Spring Boot configuration for the "prod" profile.
# ===================================================================

logging:
  level:
    ROOT: INFO
    tech.jhipster: INFO
    com.mabdullah.courseapp.courseapp: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /management
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: false
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  cloud:
    consul:
      discovery:
        prefer-ip-address: true
      host: localhost
      port: 8500
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://localhost:5432/courseApp
    username: courseApp
    password:
    hikari:
      pool-name: Hikari
      auto-commit: false
  liquibase:
    contexts: prod
  thymeleaf:
    cache: true

server:
  port: 8082
  shutdown: graceful
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

jhipster:
  http:
    cache:
      time-to-live-in-days: 1461
  cache:
    caffeine:
      time-to-live-seconds: 3600
      max-entries: 1000
  security:
    authentication:
      jwt:
        base64-secret: M2UwZTZhNzYyZmY2ZWYwMjEyMjhlMDI0NzM1NDkyYWMzYWQyM2U3MmY5OTNmMWEzY2MyMGI2OTVmYTQ0ODA0NmYyNjc3MTNiNjY4ODhiZTMwNDkyNjI0Nzk0NzM5MWRkZDhiNjM3M2MyYzZjOTU4MzZjNjAyZDFiMjA5YWVlYWI=
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 2592000
  logging:
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512

