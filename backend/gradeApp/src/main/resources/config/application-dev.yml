# ===================================================================
# Spring Boot configuration for the "dev" profile.
# ===================================================================

logging:
  level:
    ROOT: DEBUG
    tech.jhipster: DEBUG
    org.hibernate.SQL: DEBUG
    com.mabdullah.courseapp.gradeapp: DEBUG

management:
  zipkin:
    tracing:
      endpoint: http://consul:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0

spring:
  application:
    name: gradeApp

  devtools:
    restart:
      enabled: true
      additional-exclude: static/**
    livereload:
      enabled: false

  jackson:
    serialization:
      indent-output: true

  cloud:
    consul:
      enabled: true
      host: consul
      port: 8500
      config:
        enabled: true
        fail-fast: false
        format: yaml
        profile-separator: '-'
      discovery:
        enabled: true
        prefer-ip-address: true
        tags:
          - profile=dev
          - version='@project.version@'
          - git-version=${git.commit.id.describe:}
          - git-commit=${git.commit.id.abbrev:}
          - git-branch=${git.branch:}

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://postgres:5432/postgres
    username: postgres
    password: postgres
    hikari:
      poolName: Hikari
      auto-commit: false

  liquibase:
    contexts: dev, faker

  messages:
    cache-duration: PT1S

  thymeleaf:
    cache: false

server:
  port: 8083
  forward-headers-strategy: native

jhipster:
  cache:
    caffeine:
      time-to-live-seconds: 3600
      max-entries: 100

  security:
    authentication:
      jwt:
        base64-secret: M2UwZTZhNzYyZmY2ZWYwMjEyMjhlMDI0NzM1NDkyYWMzYWQyM2U3MmY5OTNmMWEzY2MyMGI2OTVmYTQ0ODA0NmYyNjc3MTNiNjY4ODhiZTMwNDkyNjI0Nzk0NzM5MWRkZDhiNjM3M2MyYzZjOTU4MzZjNjAyZDFiMjA5YWVlYWI=
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 2592000

  logging:
    use-json-format: false
    logstash:
      enabled: false
      host: consul
      port: 5000
      ring-buffer-size: 512
