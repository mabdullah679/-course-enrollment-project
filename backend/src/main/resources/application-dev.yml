# src/main/resources/application-dev.yml

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
    info:
      enabled: true
  health:
    db:
      enabled: false  # don’t fail health when using H2-only/dev

service:
  name: CEGM-LMS

# CEGM LMS Dev Profile Configuration
auth:
  jwt:
    # Use env JWT_SECRET if present, otherwise fall back to a dev-only secret (>=32 chars)
    secret: "${JWT_SECRET:dev-single-jwt-secret-key-at-least-32-chars-stable-fallback}"
  cookie:
    name: "cegm_dev_session"
