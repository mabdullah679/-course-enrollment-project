# CEGM LMS Dev Profile Configuration
# JWT secret from environment variable for security
auth:
  jwt:
    secret: "${JWT_SECRET:dev-single-jwt-secret-key-at-least-32-chars-stable-fallback}"
  cookie:
    name: "cegm_dev_session"

# Dev HTTP cookies: Secure=false, HttpOnly=true, SameSite=Lax, Path=/, no Domain; no __Host- prefix