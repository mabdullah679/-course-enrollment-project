logging:
  level:
    ROOT: DEBUG
    tech.jhipster: DEBUG
    org.hibernate.SQL: DEBUG
    com.mabdullah.courseapp.student: DEBUG
    org.springframework.boot.autoconfigure.security: DEBUG
    org.springframework.security: DEBUG

management:
  server:
    port: 8081
    base-path: /actuator
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

spring:
  application:
    name: studentApp

  devtools:
    restart:
      enabled: true
      additional-exclude: static/**
    livereload:
      enabled: false

  jackson:
    serialization:
      indent-output: true

  cloud:
    consul:
      enabled: false
      config:
        enabled: false
        fail-fast: false
      discovery:
        enabled: false
        prefer-ip-address: false

  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://studentapp-db:5432/studentdb
    username: studentuser
    password: studentpass
    hikari:
      poolName: Hikari
      auto-commit: false

  liquibase:
    contexts: dev, faker

  messages:
    cache-duration: PT1S

  thymeleaf:
    cache: false

  security:
    user:
      name: actuator
      password: actuator123
    oauth2:
      resourceserver:
        jwt:
          authority-prefix: ''
          authorities-claim-name: auth

server:
  port: 8081
  address: 0.0.0.0
  forward-headers-strategy: native

jhipster:
  cache:
    caffeine:
      time-to-live-seconds: 3600
      max-entries: 100

  security:
    authentication:
      jwt:
        base64-secret: M2UwZTZhNzYyZmY2ZWYwMjEyMjhlMDI0NzM1NDkyYWMzYWQyM2U3MmY5OTNmMWEzY2MyMGI2OTVmYTQ0ODA0NmYyNjc3MTNiNjY4ODhiZTMwNDkyNjI0Nzk0NzM5MWRkZDhiNjM3M2MyYzZjOTU4MzZjNjAyZDFiMjA5YWVlYWI=
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 2592000

  logging:
    use-json-format: false
    logstash:
      enabled: false
