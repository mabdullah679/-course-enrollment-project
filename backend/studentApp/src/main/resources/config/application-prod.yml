---

# ===================================================================
# Spring Boot configuration for the "prod" profile.
#
# This configuration overrides the application.yml file.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# more info @: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

logging:
  level:
    ROOT: INFO
    tech.jhipster: INFO
    com.mabdullah.courseapp.student: INFO

management:
  prometheus:
    metrics:
      export:
        enabled: false
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0  # report 100% of traces

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  cloud:
    consul:
      enabled: false
    config:
      enabled: false
      fail-fast: false
      discovery:
        enabled: false
        prefer-ip-address: false
      host: localhost
      port: 8500
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: jdbc:postgresql://localhost:5432/studentApp
    username: studentApp
    password:
    hikari:
      poolName: Hikari
      auto-commit: false
  liquibase:
    contexts: prod
  thymeleaf:
    cache: true

# You can also use Let's Encrypt:

# server:
#   port: 443
#   ssl:
#     key-store: classpath:config/tls/keystore.p12
#     key-store-password: password
#     key-store-type: PKCS12
#     key-alias: selfsigned
server:
  port: 8081
  shutdown: graceful
  compression:
    enabled: true
    mime-types:
      - text/html
      - text/xml
      - text/plain
      - text/css
      - application/javascript
      - application/json
      - image/svg+xml
    min-response-size: 1024

# Full reference is available at:
jhipster:
  http:
    cache:  # Used by the CachingHttpHeadersFilter
      timeToLiveInDays: 1461
  cache:  # Cache configuration
    caffeine:  # Caffeine configuration
      time-to-live-seconds: 3600
      max-entries: 1000
  security:
    authentication:
      jwt:
        base64-secret: M2UwZTZhNzYyZmY2ZWYwMjEyMjhlMDI0NzM1NDkyYWMzYWQyM2U3MmY5OTNmMWEzY2MyMGI2OTVmYTQ0ODA0NmYyNjc3MTNiNjY4ODhiZTMwNDkyNjI0Nzk0NzM5MWRkZDhiNjM3M2MyYzZjOTU4MzZjNjAyZDFiMjA5YWVlYWI=
        # Token is valid 24 hours
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 2592000
  logging:
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
